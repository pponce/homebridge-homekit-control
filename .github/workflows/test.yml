name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        include:
          - node: '24.22.0'
            homebridge: '2.4.0'
            npm: '11.19.1'
            reported-host: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install reported host versions
        if: matrix.reported-host
        run: node scripts/ci-host-install.js
      - name: Install isolated browser test tools
        if: matrix.node == 22 || matrix.reported-host
        run: |
          npm install --prefix "$RUNNER_TEMP/hkc-ui" --ignore-scripts --no-package-lock playwright@1.56.1
          node "$RUNNER_TEMP/hkc-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - run: node scripts/ci-verify.js
        env:
          NODE_PATH: ${{ runner.temp }}/hkc-ui/node_modules
          HKC_UI_TEST: ${{ (matrix.node == 22 || matrix.reported-host) && '1' || '' }}
      - name: Publish validation details
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ci-report.md')) return;
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Validation details (Node ${{ matrix.node }})', head_sha: context.sha,
              status: 'completed', conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: { title: 'Build, lint, tests and package', summary: fs.readFileSync('ci-report.md','utf8').slice(0,60000) }
            });
      - run: node --check homebridge-ui/server.js && node --check homebridge-ui/public/app.js
      - run: node -e "console.log(require('./tests/helpers/host').versions)"
