name: Test
on:
  push:
  pull_request:
permissions:
  contents: read
  checks: write
jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/ci-verify.js
      - name: Publish validation details
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('ci-report.md')) return;
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'Validation details (Node ${{ matrix.node }})', head_sha: context.sha,
              status: 'completed', conclusion: '${{ job.status }}' === 'success' ? 'success' : 'failure',
              output: { title: 'Build, lint, tests and package', summary: fs.readFileSync('ci-report.md','utf8').slice(0,60000) }
            });
      - run: node --check homebridge-ui/server.js && node --check homebridge-ui/public/app.js
      - run: node -e "console.log(JSON.stringify({node:process.version,homebridge:require('homebridge/package.json').version,hapController:require('hap-controller/package.json').version}))"
